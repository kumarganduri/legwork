[project]
name = "legwork-mcp"
version = "0.7.20"
description = "Your AI finds the open-source tool it needs on GitHub; Legwork installs it in a sandbox as an MCP tool."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["mcp", "model-context-protocol", "llm", "agents", "sandbox", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/kumarganduri/legwork"
Repository = "https://github.com/kumarganduri/legwork"
Issues = "https://github.com/kumarganduri/legwork/issues"

[project.scripts]
legwork = "legwork.cli:main"
legwork-mcp = "legwork.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legwork"]

# PyPI shows the README, but not GitHub's video embeds or repo-relative links:
# swap the video for a GIF and point relative links at the repo.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'https://github\.com/user-attachments/assets/9e9b80b5-99ff-4d21-b689-74655418f23d'
replacement = '![Legwork demo: Claude finds a PDF tool, you approve, Legwork installs it in a sandbox; a malware repo is blocked before install](https://raw.githubusercontent.com/kumarganduri/legwork/main/docs/assets/demo.gif)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/kumarganduri/legwork/blob/main/\1)'

# Releases are built by CI from a clean checkout; the dot-folders keep a local
# `uv build` from packing private notes that only .git/info/exclude hides.
[tool.hatch.build.targets.sdist]
exclude = ["docs/assets/*.gif", "/.launch", "/.claude", "/dist"]
