[project]
name = "legwork"
version = "0.1.0"
description = "Point it at a GitHub repo, get a working MCP tool back."
requires-python = ">=3.10"
dependencies = []

# project.scripts (the `legwork` CLI entrypoint) is added once the CLI
# itself exists — not yet, T2 is just the repo-fetcher module.

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legwork"]
