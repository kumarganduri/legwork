name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # publish.yml runs the same tests before releasing

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel Macs; x86-64 and ARM64 Linux (the seccomp
        # filter has a program per architecture).
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      LEGWORK_REQUIRE_SANDBOX: "1"  # fail, don't skip, if the sandbox can't start
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Allow user namespaces for bwrap only (the README's Ubuntu 24.04+ step)
        if: runner.os == 'Linux'
        run: |
          python3 -c "from legwork.sandbox_runner import BWRAP_APPARMOR_PROFILE as p; print(p, end='')" > /tmp/bwrap.aa
          sudo cp /tmp/bwrap.aa /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true && echo "bwrap OK"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      # What a new user does, with no API key: start the hub, search, install
      # from the public cache, use the tool on a real file, check refusals.
      - name: End to end (hub, no key)
        run: uv run python scripts/e2e_hub.py
      - name: legwork doctor
        run: uv run legwork doctor

  # Other Linux families, as a normal (non-root) user like a real one. The
  # container is privileged only so bubblewrap can create namespaces inside
  # it, as it can on a real machine.
  test-distro:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro: ["fedora:latest", "debian:stable"]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
      options: --privileged
    steps:
      - name: Install what a user would (bubblewrap, Python, git, Node)
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y -q bubblewrap python3 git curl nodejs npm which findutils procps-ng shadow-utils
          else
            apt-get update -q && apt-get install -y -q bubblewrap python3 python3-venv git curl nodejs npm ca-certificates passwd
          fi
          useradd -m tester
          # These containers run on GitHub's Ubuntu host, whose kernel-wide
          # AppArmor setting blocks unprivileged user namespaces everywhere,
          # containers included. Real Fedora and Debian machines don't set
          # it, so turn it off to test them as they are.
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/checkout@v4
      - name: Test as a normal user
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/tester/legwork && chown -R tester:tester /home/tester/legwork
          su - tester -c '
            set -e
            curl -LsSf https://astral.sh/uv/install.sh | sh -s -- --quiet
            cd ~/legwork
            ~/.local/bin/uv sync -q
            LEGWORK_REQUIRE_SANDBOX=1 ~/.local/bin/uv run pytest -q
          '


  # The image MCP directories build (Glama): it must start and list the
  # hub's tools over stdio, and refuse installs (Dockerfile, --inspect-only).
  docker-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t legwork-inspect .
      - name: initialize and tools/list over stdio, as a directory does
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"install_tool","arguments":{"repo":"jsvine/pdfplumber"}}}' \
            | docker run -i --rm legwork-inspect > replies.jsonl
          python3 - <<'PY'
          import json
          replies = {m["id"]: m for m in map(json.loads, open("replies.jsonl")) if "id" in m}
          tools = {t["name"] for t in replies[2]["result"]["tools"]}
          assert {"find_tools", "install_tool", "install_status", "list_installed_tools", "use_tool"} <= tools, tools
          refused = replies[3]["result"]
          assert refused["isError"] and "--inspect-only" in refused["content"][0]["text"], refused
          print("ok:", sorted(tools))
          PY

  # The Claude Desktop extension (mcpb/): its manifest must stay valid.
  # It's built after each release by scripts/build_mcpb.sh.
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
