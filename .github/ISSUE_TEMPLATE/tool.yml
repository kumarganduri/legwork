name: A tool you wish it could install
description: A repo Legwork refused, or one you'd like in the public cache
labels: [cache]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: owner/repo
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you'd use it for
      description: The request you gave your AI, if there was one, and what Legwork said.
    validations:
      required: true
