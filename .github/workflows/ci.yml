name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The sandbox is macOS sandbox-exec, so the real tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
