[project]
name = "legwork-mcp"
version = "0.7.5"
description = "Your AI finds the open-source tool it needs on GitHub; Legwork installs it safely, as a sandboxed MCP tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["mcp", "model-context-protocol", "llm", "agents", "sandbox", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/kumarganduri/legwork"
Repository = "https://github.com/kumarganduri/legwork"
Issues = "https://github.com/kumarganduri/legwork/issues"

[project.scripts]
legwork = "legwork.cli:main"
legwork-mcp = "legwork.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legwork"]
